```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Game 3D - Robin Studio Integrated</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #9cc4e4;
            font-family: sans-serif;
            user-select: none;
        }
        #info-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="info-bar">Studio 3D Open World - TransformControls Active</div>

    <!-- استدعاء مكتبة Three.js والمتحكمات عبر CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <script>
        // إعداد بيئة المشهد بحسب إعدادات Robin Studio (Sky: #9cc4e4, Ground: #6f7a55)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9cc4e4);
        if (true) { // fog enabled
            scene.fog = new THREE.FogExp2(0x9cc4e4, 0.015);
        }

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // الإضاءة (Sun settings)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 20, 15);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // الأرضية (Ground)
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x6f7a55, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // مجسمات المشهد الافتراضية القابلة للتحريك
        const interactiveObjects = new THREE.Group();
        
        const boxGeo = new THREE.BoxGeometry(2, 2, 2);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x3399ff });
        const sampleBox = new THREE.Mesh(boxGeo, boxMat);
        sampleBox.position.set(0, 1, 0);
        sampleBox.castShadow = true;
        interactiveObjects.add(sampleBox);

        const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff4757 });
        const sampleSphere = new THREE.Mesh(sphereGeo, sphereMat);
        sampleSphere.position.set(4, 1.2, 0);
        sampleSphere.castShadow = true;
        interactiveObjects.add(sampleSphere);

        scene.add(interactiveObjects);

        // تحكم الكاميرا (OrbitControls)
        const orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        // ميزة أزرار التحريك المطلوبة (TransformControls)
        const transformControl = new THREE.TransformControls(camera, renderer.domElement);
        transformControl.attach(sampleBox); // ربط افتراضي بالمجسم الأول
        scene.add(transformControl);

        // منع تحريك الكاميرا أثناء سحب الأزرار
        transformControl.addEventListener('dragging-changed', function (event) {
            orbit.enabled = !event.value;
        });

        // التبديل السريع بين وضعيات التحريك بالأزرار أو لوحة المفاتيح
        window.addEventListener('keydown', function (event) {
            switch (event.key.toLowerCase()) {
                case 'g': transformControl.setMode('translate'); break;
                case 'r': transformControl.setMode('rotate'); break;
                case 't': transformControl.setMode('scale'); break;
            }
        });

        // اختيار المجسمات باللمس والنقر لتغيير مكان التركيز للأزرار
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            if (event.target.tagName !== 'CANVAS') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects.children, true);

            if (intersects.length > 0) {
                transformControl.attach(intersects[0].object);
            }
        });

        // حلقة الرسم والتحديث التلقائي
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        // التجاوب التلقائي مع شاشة الهاتف عند تدوير الجهاز
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
