```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 3D Game - Integrated TransformControls</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info-panel">Studio 3D Open World - TransformControls Active (G: Translate, R: Rotate, T: Scale)</div>

    <!-- استدعاء مكتبة Three.js والمتحكمات عبر CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <script>
        // إعداد المشهد، الكاميرا والمستعرض الأساسي
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // الإضاءة الأساسية للمشهد
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // أرضية أو شبكة للمشهد (Grid)
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // مجسمات البيئة الأصلية الخاصة بمشروعك (ويمكنك تبديلها أو إضافتها بحرية)
        const groupObjects = new THREE.Group();
        
        const geom1 = new THREE.BoxGeometry(2, 2, 2);
        const mat1 = new THREE.MeshStandardMaterial({ color: 0x3498db });
        const primaryObject = new THREE.Mesh(geom1, mat1);
        primaryObject.position.set(0, 1, 0);
        groupObjects.add(primaryObject);

        const geom2 = new THREE.ConeGeometry(1.5, 3, 4);
        const mat2 = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
        const secondaryObject = new THREE.Mesh(geom2, mat2);
        secondaryObject.position.set(4, 1.5, 0);
        groupObjects.add(secondaryObject);

        scene.add(groupObjects);

        // تحكم الكاميرا الأساسي (OrbitControls)
        const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;

        // ميزة TransformControls المطلوبة لربطها بالمجسمات وأزرار التحريك
        const transformControl = new THREE.TransformControls(camera, renderer.domElement);
        transformControl.attach(primaryObject); // ربط الافتراضي بالمجسم الأساسي
        scene.add(transformControl);

        // منع تداخل حركة الكاميرا أثناء سحب أزرار التحريك
        transformControl.addEventListener('dragging-changed', function (event) {
            orbitControls.enabled = !event.value;
        });

        // التبديل بين وضعيات التحريك بلوحة المفاتيح
        window.addEventListener('keydown', function (event) {
            switch (event.key.toLowerCase()) {
                case 'g': // للتحريك (Translate)
                    transformControl.setMode('translate');
                    break;
                case 'r': // للتدوير (Rotate)
                    transformControl.setMode('rotate');
                    break;
                case 't': // للتكبير والتصغير (Scale)
                    transformControl.setMode('scale');
                    break;
            }
        });

        // إمكانية النقر على المجسمات لتغيير مكان التركيز للأزرار
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            // تجاهل النقر إذا كان على واجهة التحكم
            if (event.target.tagName !== 'CANVAS') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(groupObjects.children, true);

            if (intersects.length > 0) {
                let selectedObject = intersects[0].object;
                transformControl.attach(selectedObject);
            }
        });

        // حلقة التحديث والرسم الأساسية للعبة
        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
        }
        animate();

        // التجاوب التلقائي مع تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
