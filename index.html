<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robin Studio - 3D World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #9cc4e4;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
    <!-- مكتبات Three.js الأساسية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة التحكم والتحريك (Transform Controls) لحماية الأشكال من التداخل -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>
    <div id="info">استديو روبن - استخدم الممحاة أو الأزرار للتحكم الدقيق</div>

    <script>
        // إعداد المشهد والكاميرا بناءً على إعداداتك
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#9cc4e4');
        if(true) { // إعداد الضباب (Fog)
            scene.fog = new THREE.FogExp2('#9cc4e4', 0.015);
        }

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // تحكم الكاميرا
        const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;

        // إضاءة الشمس بناءً على إعداداتك (sunA, sunH, sunP)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(40, 55, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // الأرضية (بناءً على لون العشب الخاص بك #6f7a55)
        const groundGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({ color: '#6f7a55', roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // أزرار التحريك (TransformControls) لضبط أماكن الأشكال ومنع التداخل
        const transformControls = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transformControls);

        // إيقاف تحريك الكاميرا عند سحب الأزرار لضمان دقة العمل
        transformControls.addEventListener('dragging-changed', function (event) {
            orbitControls.enabled = !event.value;
        });

        // مثال على مجسم تجريبي في العالم (يمكنك نسخه أو استبداله)
        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const material = new THREE.MeshStandardMaterial({ color: 0x3399ff });
        const sampleBox = new THREE.Mesh(geometry, material);
        sampleBox.position.set(0, 1.5, 0);
        sampleBox.castShadow = true;
        scene.add(sampleBox);

        // ربط المجسم التجريبي بأزرار التحريك عند الضغط عليه
        transformControls.attach(sampleBox);

        // حلقة التحديث والرسم (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
        }
        animate();

        // التوافق مع تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
